# 数据库配置
spring.datasource.url=jdbc:postgresql://localhost:5432/jokedb
spring.datasource.username=jokedb
spring.datasource.password=jokedb
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 配置
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 数据初始化
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# Spring AI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY:your-api-key-here}
spring.ai.openai.base-url=${OPENAI_API_BASE_URL:https://api.deepseek.com/}
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.7

# Vector Store Configuration
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=true
# 禁用PgVectorStore自动配置以避免bean冲突
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.vectorstore.pgvector.PgVectorStoreAutoConfiguration

# 本地嵌入模型配置
embedding.dimension=384
embedding.provider=local

# 向量存储开关
vector.store.enabled=true

# JWT Configuration
jwt.secret=myVeryLongSecretKeyForJWTTokenGenerationWithAtLeast256Bits
jwt.expiration=3600
jwt.refresh-expiration=2592000

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging Configuration
logging.level.com.example.jokemanager=INFO
logging.level.org.springframework.security=INFO
logging.charset.console=UTF-8
logging.charset.file=UTF-8