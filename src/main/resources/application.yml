server:
  port: 8080

spring:
  application:
    name: joke-manager
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:h2:file:./target/jokedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=PostgreSQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

  sql:
    init:
      mode: always
      platform: h2
      encoding: UTF-8

jwt:
  secret: your-secret-key-here-make-it-very-long-and-secure
  expiration: 86400000
  issuer: joke-manager

logging:
  level:
    org.springframework: INFO
    org.springframework.security: INFO
    com.example.jokemanager: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# 嵌入服务配置
embedding:
  provider: local  # local 或 openai
  dimension: 384   # 向量维度
  model: paraphrase-multilingual-MiniLM-L12-v2  # 本地模型名称

# Spring AI 配置
  ai:
    openai:
      enabled: false  # 默认禁用OpenAI，使用本地嵌入
    embedding:
      transformers:
        enabled: true
        model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
